<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
</head>

<body>

<script>

function getComputerChoice(){

    let random = Math.random();

    if(random < 0.33){
        return "rock";
    } 
    else if(random <= 0.66){
        return "paper";
    } 
    else {
        return "scissors";
    }
}


let humanScore = 0;
let computerScore = 0;


function playRound(humanChoice, computerChoice){

    if(
        (humanChoice === "rock" && computerChoice === "scissors") ||
        (humanChoice === "paper" && computerChoice === "rock") ||
        (humanChoice === "scissors" && computerChoice === "paper")
    ){
        humanScore++;
        result.textContent = `你赢了这一局！电脑出了 ${computerChoice}`;

    } 
    else if(humanChoice === computerChoice){

        result.textContent = `平局！双方都是 ${humanChoice}`;

    }
    else{

        computerScore++;
        result.textContent = `你输了这一局！电脑出了 ${computerChoice}`;

    }


    score.textContent = 
        `玩家:${humanScore} 电脑:${computerScore}`;


    if(humanScore === 5){

        result.textContent = "恭喜，你赢了游戏！";

        disableButtons();

    }


    if(computerScore === 5){

        result.textContent = "电脑赢了游戏！";

        disableButtons();

    }

}




// 创建 DOM

const body = document.querySelector("body");


const div = document.createElement("div");


const butP = document.createElement("button");
butP.textContent = "paper";


const butR = document.createElement("button");
butR.textContent = "rock";


const butS = document.createElement("button");
butS.textContent = "scissors";


const score = document.createElement("p");
score.textContent = `玩家:${humanScore} 电脑:${computerScore}`;


const result = document.createElement("p");



div.appendChild(butP);
div.appendChild(butR);
div.appendChild(butS);

div.appendChild(score);
div.appendChild(result);


body.appendChild(div);



// 事件

div.addEventListener("click", playGame);



function playGame(e){

    if(e.target.tagName !== "BUTTON"){
        return;
    }


    let humanChoice = e.target.textContent;


    playRound(
        humanChoice,
        getComputerChoice()
    );

}




function disableButtons(){

    butP.disabled = true;
    butR.disabled = true;
    butS.disabled = true;

}


</script>

</body>
</html>
